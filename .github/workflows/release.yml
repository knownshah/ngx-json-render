name: Release

# Publishes `ngx-json-render`. Two ways in, one job graph:
# - push a tag `v<version>` matching projects/ngx-json-render/package.json;
# - run the workflow by hand ("Run workflow" in the Actions tab) on the branch
#   that holds the version bump: the `tag` job derives the tag from the
#   manifest and creates it, and everything after is identical. A tag created
#   with the workflow's own token does not start a second run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Decides the tag and, on a manual run, creates it. The only job holding
  # `contents: write`, and it never holds the npm credentials.
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Derive the tag from the package version
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./projects/ngx-json-render/package.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "$TAG" != "$GITHUB_REF_NAME" ]; then
              echo "Tag $GITHUB_REF_NAME does not match package version $TAG" >&2
              exit 1
            fi
          else
            # A manual run publishes the commit it was started on. The tag may
            # already point there (a rerun); anything else means the version
            # was not bumped.
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha >existing 2>/dev/null; then
              EXISTING=$(cat existing)
              if [ "$EXISTING" != "$GITHUB_SHA" ]; then
                echo "$TAG already exists at $EXISTING, not at $GITHUB_SHA: bump the version first" >&2
                exit 1
              fi
            else
              gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
              echo "Created $TAG at $GITHUB_SHA"
            fi
          fi
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"

  publish:
    runs-on: ubuntu-latest
    needs: tag
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    # Whether the package actually reached npm, which is not the same as this
    # job going green: the verification below runs after the publish and
    # cannot un-publish anything.
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # OIDC trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # A renderer minor lands on npm as `latest` immediately, so the Material
      # catalog's peer range has to admit this version before it ships — the
      # pair is installed together and both resolve to latest. Runs after the
      # install because it reads semver out of node_modules.
      - name: Check peer ranges between workspace packages
        run: npm run check:peers

      - name: Build library
        run: npm run build:lib

      # --coverage is what turns on the coverageThresholds in angular.json;
      # without it this gate is weaker than the one CI already applied to the
      # same commit, which is the wrong way round for the step that publishes.
      - name: Test library
        run: npx ng test ngx-json-render --coverage

      - name: Copy LICENSE into package
        run: cp LICENSE dist/ngx-json-render/

      - name: Publish to npm
        id: publish
        run: |
          npm publish
          echo "published=true" >> "$GITHUB_OUTPUT"
        working-directory: dist/ngx-json-render

      # `check:peers` above compares this commit's manifests, which are bumped
      # together and therefore always agree. This compares the commit against
      # what npm now serves, which is the only place a stale published peer
      # range shows up — and it downgrades the pair silently rather than
      # erroring. The renderer is the depended-upon half, so an incoherent
      # pair here is the expected middle of the lockstep and only warns; the
      # catalog release is what has to make it coherent again.
      - name: Verify the published package installs as itself
        run: npm run check:published -- ngx-json-render

  # Gated on the publish rather than on the publish *job*. Once a version is
  # on npm it cannot be taken back, so the release notes describing it should
  # exist whatever the verification afterwards concluded — otherwise a red
  # check leaves the registry and the releases page disagreeing, which is how
  # v0.4.0 shipped with no release entry. Kept as its own job so the half
  # holding npm's publishing credentials never also holds `contents: write`.
  github-release:
    runs-on: ubuntu-latest
    needs: [tag, publish]
    if: always() && needs.publish.outputs.published == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub release (if missing)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
